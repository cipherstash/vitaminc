[package]
name = "vitaminc-aead-value"
description = "Language-neutral, self-describing value tree for encrypting dynamically typed values with the Vitamin-C AEAD traits. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-aead-value"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vitaminc-aead = { version = "0.5.1", path = "../aead" }
vitaminc-protected = { version = "0.5.1", path = "../protected" }

zeroize = { workspace = true }

[features]
default = []
chrono = ["dep:chrono"]
rust_decimal = ["dep:rust_decimal"]

[dependencies.chrono]
version = "0.4.44"
default-features = false
features = ["std"]
optional = true

[dependencies.rust_decimal]
version = "1.41"
default-features = false
features = ["std"]
optional = true

[dev-dependencies]
vitaminc-encrypt = { path = "../encrypt" }
