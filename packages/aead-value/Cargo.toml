[package]
name = "vitaminc-aead-value"
description = "Language-neutral, self-describing value tree for encrypting dynamically typed values with the Vitamin-C AEAD traits. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-aead-value"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vitaminc-aead = { version = "0.5.1", path = "../aead" }
vitaminc-protected = { version = "0.5.1", path = "../protected" }

zeroize = { workspace = true }

[features]
default = []
canonical = ["dep:orderable-bytes", "dep:unicode-normalization", "dep:unicode-general-category"]
chrono = ["dep:chrono", "orderable-bytes?/chrono"]
rust_decimal = ["dep:rust_decimal", "orderable-bytes?/decimal"]

[dependencies.chrono]
version = "0.4.44"
default-features = false
features = ["std"]
optional = true

[dependencies.rust_decimal]
version = "1.41"
default-features = false
features = ["std"]
optional = true

[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
vitaminc-encrypt = { path = "../encrypt" }

# Temporary review pin: ore.rs #97; replace with its 0.2 release before publishing.
[dependencies.orderable-bytes]
git = "https://github.com/cipherstash/ore.rs"
rev = "b3b7800b9c0cd8f7c53c5382f8e018a4e8bcbbd5"
optional = true

# NFC is stable for assigned code points, and the Unicode 16 assignment check
# below refuses everything else, so newer normalization releases are safe.
[dependencies.unicode-normalization]
version = "0.1.24"
optional = true

# Exact pin: this table defines which code points are assigned in Unicode 16,
# and a newer table would widen the accepted input of a frozen domain.
[dependencies.unicode-general-category]
version = "=1.1.0"
optional = true
