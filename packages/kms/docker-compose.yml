# LocalStack for this crate's AWS KMS-backed tests (`AwsKmsHmac`'s
# `test_finalize`, and `aws.rs`'s adapter tests where they're not covered by
# `aws-smithy-mocks`). This assumption already existed implicitly in
# `get_config()`'s hardcoded `http://localhost:4566` — documented here for
# the first time (see CIP-4029, Linear map CIP-4028).
#
# LocalStack Community's `kms` service covers CreateKey/GenerateDataKey/
# Decrypt/GenerateMac — no Pro tier needed.
#
# Usage:
#   docker compose -f packages/kms/docker-compose.yml up -d
#   cargo test -p vitaminc-kms
#   docker compose -f packages/kms/docker-compose.yml down
services:
  localstack:
    # Pinned to the last Community-only major: `:stable`/`:latest` now
    # bundle LocalStack's "unified" image, which exits at startup
    # requiring a paid LOCALSTACK_AUTH_TOKEN even for previously-free
    # services (confirmed by actually running this — CIP-4035, Linear map
    # CIP-4028). `:4` still runs the plain Community image with no token.
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kms
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 15
