[package]
name = "vitaminc-kms"
description = "AWS KMS implementation for Vitamin C traits"
documentation = "https://docs.rs/vitaminc-kms"
version.workspace = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Own floor, above the workspace MSRV: the AWS SDK (aws-config, aws-sdk-kms) needs 1.94.1.
rust-version = "1.94.1"

[dependencies]
vitaminc-async-traits = { version = "0.8.2", path = "../async-traits" }
vitaminc-traits = { version = "0.8.2", path = "../traits" }
vitaminc-protected = { version = "0.8.2", path = "../protected" }
aws-sdk-kms = "1.109.0"
aws-config = "1.8.18"

thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
