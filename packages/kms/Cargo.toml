[package]
name = "vitaminc-kms"
description = "AWS KMS implementation for Vitamin C traits"
documentation = "https://docs.rs/vitaminc-kms"
version.workspace = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vitaminc-async-traits = { version = "0.2.0-pre.1", path = "../async-traits" }
vitaminc-traits = { version = "0.2.0-pre.1", path = "../traits" }
vitaminc-protected = { version = "0.2.0-pre.1", path = "../protected" }
aws-sdk-kms = "1.107.0"
aws-config = "1.8.17"

thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
