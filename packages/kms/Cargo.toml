[package]
name = "vitaminc-kms"
description = "AWS KMS implementation for Vitamin C traits"
documentation = "https://docs.rs/vitaminc-kms"
version.workspace = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# Own floor, above the workspace MSRV, required by the AWS SDK.
rust-version = "1.94.1"

[dependencies]
vitaminc-async-traits = { version = "0.9.0", path = "../async-traits" }
vitaminc-traits = { version = "0.9.0", path = "../traits" }
vitaminc-protected = { version = "0.9.0", path = "../protected" }
# `default-features = false` drops the SDK's `rustls` feature, which is the
# legacy hyper 0.14 + rustls 0.21 + ring client: end-of-life, carrying open
# RustSec advisories, and unused once `default-https-client` (hyper 1 +
# rustls 0.23 on aws-lc-rs) is on. The other two are the rest of the default set.
aws-sdk-kms = { version = "1.109.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = "1.8.18"

thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
