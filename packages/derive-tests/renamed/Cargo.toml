[package]
name = "derive-tests-renamed"
description = "Test-only crate, never published: the vitaminc-protected derives from a crate that depends on vitaminc-protected renamed to vp, so no vitaminc_protected path exists."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# `vp` (a renamed `vitaminc-protected`) must stay the only dependency: the derives read this manifest and must use the renamed path.
[dependencies]
vp = { package = "vitaminc-protected", path = "../../protected" }

[[test]]
name = "derives"
path = "tests/derives.rs"
