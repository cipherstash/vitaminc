[package]
name = "vitaminc-aead-frame"
description = "Transport frame and ciphertext codec for carrying Vitamin-C AEAD values and ciphertexts across an FFI boundary, and a versioned storage profile for values that are kept. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-aead-frame"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
# The corpus check runs in CI against git history; it is no part of the
# crate a dependent builds.
exclude = ["scripts/"]

[lints.rust]
# Set by `cargo kani`, which builds the proof harnesses in
# src/storage/proofs.rs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[package.metadata.docs.rs]
all-features = true

[dependencies]
vitaminc-aead = { version = "0.8.0", path = "../aead" }
vitaminc-protected = { version = "0.8.0", path = "../protected", optional = true }
serde = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = []
# serde over the transport frame (`vitaminc_aead_frame::serde`): read any
# `Deserialize` type from frame bytes and write any `Serialize` type as
# frame bytes, for data a host exchanges with Rust that is not plaintext.
# Also the storage profile (`vitaminc_aead_frame::storage`): the same
# mapping as a versioned blob whose format is frozen, for bytes that are
# kept (STORAGE.md).
serde = ["dep:serde", "dep:vitaminc-protected", "dep:zeroize"]

[dev-dependencies]
serde_bytes = { workspace = true }
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
serde_json = "1"
# Path-only, so publish order does not matter: the conformance test builds
# each vector's scalar independently through the chrono and rust_decimal
# conversions, and the fixture test opens a pre-ADR-0001 ciphertext with
# real AES-256-GCM.
vitaminc-aead = { path = "../aead", features = ["chrono", "rust_decimal"] }
vitaminc-encrypt = { path = "../encrypt" }
vitaminc-protected = { path = "../protected" }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
