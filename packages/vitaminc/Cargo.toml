[package]
name = "vitaminc"
description = "VitaminC cryptographic suite by CipherStash"
documentation = "https://docs.rs/vitaminc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
vitaminc-kms = { path = "../kms", version = "0.2.0-pre.1", optional = true }
vitaminc-permutation = { path = "../permutation", version = "0.2.0-pre.1", optional = true }
vitaminc-protected = { path = "../protected", version = "0.2.0-pre.1", optional = true }
vitaminc-random = { path = "../random", version = "0.2.0-pre.1", optional = true }
vitaminc-traits = { path = "../traits", version = "0.2.0-pre.1", optional = true }
vitaminc-async-traits = { path = "../async-traits", version = "0.2.0-pre.1", optional = true }
vitaminc-encrypt = { path = "../encrypt", version = "0.2.0-pre.1", optional = true }
vitaminc-aead = { path = "../aead", version = "0.2.0-pre.1", optional = true }

[features]
protected = ["dep:vitaminc-protected"]
random = ["dep:vitaminc-random"]
permutation = ["dep:vitaminc-permutation", "protected"]
traits = ["dep:vitaminc-traits"]
async-traits = ["dep:vitaminc-async-traits", "traits"]
aws-kms = ["traits", "dep:vitaminc-kms"]
aead = ["dep:vitaminc-aead"]
encrypt = ["traits", "aead", "dep:vitaminc-encrypt"]

[[test]]
name = "timing_safe_runtime"
path = "tests/timing_safe_runtime.rs"
required-features = ["protected"]

[[test]]
name = "opaque_debug_runtime"
path = "tests/opaque_debug_runtime.rs"
required-features = ["protected"]

[dev-dependencies.vitaminc]
path = "./"
features = ["protected"]
default-features = false
