[package]
name = "vitaminc-random-derives"
description = "Derive macros for vitaminc-random. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-random-derives"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# Path-only consumer dependency for runnable macro documentation.
vitaminc-random = { path = "../random" }
