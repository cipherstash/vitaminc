[package]
name = "vitaminc-aead-napi"
description = "NAPI (Node-API) value bridge for the Vitamin-C AEAD encryption traits. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-aead-napi"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vitaminc-aead = { version = "0.2.0-pre.1", path = "../aead" }
vitaminc-protected = { version = "0.2.0-pre.1", path = "../protected" }

# napi5 (Node ≥ 12) is needed for Date detection and napi6 (Node ≥ 10.20,
# implies napi5) for `napi_get_all_property_names` — the only own-property
# enumeration Node-API offers; every supported Node release is far beyond
# both levels.
napi = { version = "3", default-features = false, features = ["napi6"] }
zeroize = { workspace = true }

[dev-dependencies]
vitaminc-encrypt = { version = "0.2.0-pre.1", path = "../encrypt" }
# `noop` stubs the Node-API symbols so unit tests link without a Node host.
napi = { version = "3", default-features = false, features = ["noop"] }
