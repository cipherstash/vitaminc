[package]
name = "vitaminc-aead-napi"
description = "NAPI (Node-API) value bridge for the Vitamin-C AEAD encryption traits. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-aead-napi"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
thiserror.workspace = true
vitaminc-aead = { version = "0.5.1", path = "../aead", features = ["chrono", "rust_decimal"] }
vitaminc-protected = { version = "0.5.1", path = "../protected" }

# napi5 (Node ≥ 12) is needed for Date detection; napi6 (implies napi5) for
# BigInt and for `napi_get_all_property_names` — the only own-property
# enumeration Node-API offers. Every supported Node release is far beyond
# both levels.
napi = { version = "3", default-features = false, features = ["napi6"] }
zeroize = { workspace = true }

[dev-dependencies]
# `noop` disables automatic addon registration in unit tests. The live
# Node suites, including the cipher round trips, run against the test addon
# in `tests/addon`, which is its own workspace so this feature cannot stub
# the real Node-API symbols there.
napi = { version = "3", default-features = false, features = ["noop"] }
