
# cargo-vet audits file

[[audits.jiff]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = "Full review of the published crate, in three parts. Unsafe: every unsafe block, fn and impl read and sound: the uninitialised-buffer and Vec spare-capacity writer in fmt/buffer.rs (indexing bounds-checked before each unchecked access, only UTF-8 written before from_utf8_unchecked) and Write::as_mut_vec in fmt/mod.rs; the pointer-tagged TimeZone Repr in tz/timezone.rs (private tag set only by its constructors, 8-byte alignment asserted, Arc raw-pointer counts balanced, Send/Sync over plain-data payloads); and the Android dlopen/dlsym, emscripten and Windows GetDynamicTimeZoneInformation FFI under tz/system/, whose signatures match the platform headers. No unsafe relies on the value ranges of the datetime types. Time zones and system access: with default-features = false (with or without std) jiff reads no environment variables and no files; with tz-system, tzdb-zoneinfo or tzdb-concatenated it reads TZ, TZDIR, ANDROID_ROOT and ANDROID_DATA and TZif files, with no network, process spawning or writes; zone names are matched against enumerated files, never joined onto a path, and caches hold only zones that exist; a path in TZ or TZDIR is read unbounded and through symlinks, the libc trust model. Civil, Timestamp and fmt: checked arithmetic with explicit range types, fixed-size printer buffers, and 660M fuzz executions with overflow checks plus 1 MB pathological inputs found no unbounded allocation, recursion or superlinear time. One bug (jiff-core Offset::to_timestamp, below) can yield a Timestamp up to 1 s before Timestamp::MIN that jiff cannot rebuild; vitaminc refuses it before sealing. With alloc, parse errors echo the input, so vitaminc never forwards jiff error text. Panicking constructors and operators (constant, civil::date, Span setters, Add/Sub) are documented and avoided in favour of their checked forms. No build script, proc macro or links. Sources match crates/jiff at 3b1bdf9d, the trusted-publishing commit, apart from unpackaged test data. No advisories."

[[audits.jiff-core]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = "Full review of the published crate. Its one unsafe block, ArrayStr::as_str (util/mod.rs), is sound: the private len and bytes fields are set only by new and push_str, which bound len by N <= 255 and copy only str bytes; Date::new_unchecked is commented out. Read: bounds.rs, civil date and epoch-day conversions, Timestamp, Offset conversions, and the TZif and POSIX TZ parsers. The parsers check every length with checked arithmetic before allocating, cap the footer scan and fattening, and were panic-free over about 3.4M mutation iterations; the date and timestamp code was fuzzed with the jiff crate (660M executions, overflow checks on). One bug: Offset::to_timestamp (tz/offset.rs:219-234) canonicalises a negative second with nonzero nanoseconds and checks only the seconds bound, so it can return a Timestamp up to 1 s before Timestamp::MIN, which trips a debug assertion and does not round-trip in release; vitaminc refuses such a value before sealing. Primitive::as_i8 and siblings truncate silently in release, but every use follows a bounds check. no_std, no build script, proc macro or links; dependencies only optional arbitrary, defmt and log. Sources match crates/jiff-core at 3b1bdf9d, the trusted-publishing commit. No advisories."

[[audits.jiff-static]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = "Full review of the published proc macro (src/lib.rs, 498 lines); no build script. At expansion, include! reads exactly the one file named by a string literal in the macro call (no environment variables or default paths) and parses it with jiff-core TZif parser; get! (feature tzdb) reads jiff-tzdb embedded data. No network, process or environment access. The generated code builds statics from jiff-core types with checked const constructors and quote-escaped literals; its only unsafe, TZ.copy(), is on a static built by TimeZone::__internal_from_tzif, which meets the contract of jiff 1.0.0 TimeZone::copy (static TZif variant, no reference count). In our graph it is reachable only through jiff never-active cfg(any()) version pin or its optional static features. Sources match crates/jiff-static at 3b1bdf9d, the trusted-publishing commit. No advisories."

[[audits.libc]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "0.2.189 -> 0.2.190"
notes = "build.rs read in full (refactor to a Cfg enum with validate_cfg self-checks and new libc_unstable_time64, libc_elfv2 and uclibc32_time64 cfgs; only env reads and cargo: directives, with the pre-existing version probes now gated on target_os), as were Cargo.toml (exclude to include allow-list, no dependency or feature change), macros.rs (s2! and custom_struct! Default generators, f! absorbing safe_f!) and types.rs (transmute replaced by from_raw_parts, new const cstr). Every hunk with a function body, impl, unsafe, link or link_name change was read: FD_* gain explicit bounds panics, siginfo_t accessors move to proper union layouts, the unsound af_alg_iv trait impls are removed, the Hurd LFS dedup was verified against the shared unix/mod.rs declarations, and libutil is no longer linked on uclibc mips32; the remainder is bindings data across platforms including the new HelenOS target and Apple non-macOS removals. All changes map to the 0.2.190 changelog; no crypto-relevant symbol (getrandom, getentropy, mmap/mlock, explicit_bzero, arc4random, clock_gettime, sysconf) is removed or re-signed."

