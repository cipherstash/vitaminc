[[audits.serde_json]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "1.0.151 -> 1.0.154"
notes = "Maps to 1.0.152 (#1346 -0 keeps its sign in the buffered-number path; #1347 Number::as_f32 returns None for non-finite), 1.0.153 (#1345 invalid-UTF-8 errors report the first bad byte; the new line/column arithmetic is error-path only, bounds-sound and saturating) and 1.0.154 (#1333 preserve_order implies alloc instead of std, explicit std RandomState hasher under std, new optional dependency foldhash only under no_std). build.rs is unchanged; remaining hunks are max_value() to MAX cleanup in lexical/math.rs, a dropped authors field, CI and tests. This workspace does not enable preserve_order, so foldhash is not in the graph."

