[package]
name = "vitaminc-napi-test-addon"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
vitaminc-aead = { path = "../../../aead", features = ["chrono", "rust_decimal"] }
vitaminc-aead-napi = { path = "../.." }
vitaminc-encrypt = { path = "../../../encrypt" }
vitaminc-protected = { path = "../../../protected" }

[build-dependencies]
napi-build = "2"
