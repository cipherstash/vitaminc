[package]
name = "vitaminc-protected"
description = "Protected type wrappers for handling sensitive data. Part of the VitaminC cryptographic suite."
documentation = "https://docs.rs/vitaminc-protected"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitvec = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

digest = { version = "0.11.2", features = ["mac"] }
subtle = "2.6.1"

quickcheck = { version = "1.1.0", optional = true }
vitaminc-protected-derive = { path = "../protected-derive", version = "0.5.0" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
# Only for `#[cfg_attr(test, mutants::skip)]`; consumers never see it.
mutants = "0.0.4"
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
rmp-serde = "1.3.1"
serde_json = "1.0.150"
sha2 = { version = "0.11.0", features = ["zeroize"] }
trybuild = "1.0.118"

# The fork test forks, and a libtest process is never single-threaded (the
# harness keeps a coordinator thread), so it runs as a plain `main`.
[[test]]
name = "locked_fork"
harness = false

[features]
bitvec = []
arbitrary = ["dep:quickcheck"]
