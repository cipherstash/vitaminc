[package]
name = "vitaminc-protected"
description = "Protected type wrappers for handling sensitive data. Part of the VitaminC cryptographic suite."
documentation = "https://docs.rs/vitaminc-protected"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitvec = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

digest = { version = "0.11.2", features = ["mac"] }
subtle = "2.6.1"

quickcheck = { version = "1.1.0", optional = true }
vitaminc-protected-derive = { path = "../protected-derive", version = "0.3.0" }

[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
rmp-serde = "1.3.1"
serde_json = "1.0.150"
sha2 = { version = "0.11.0", features = ["zeroize"] }
trybuild = "1.0.118"

[features]
bitvec = []
arbitrary = ["dep:quickcheck"]
