[package]
name = "vitaminc-prf"
description = "Structured pseudorandom functions for the VitaminC cryptographic suite."
documentation = "https://docs.rs/vitaminc-prf"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
chrono = ["vitaminc-aead-value/chrono"]
rust_decimal = ["vitaminc-aead-value/rust_decimal"]

[dependencies]
vitaminc-aead-value = { version = "0.5.1", path = "../aead-value", features = ["canonical"] }
mutants = "0.0.4"
thiserror = { workspace = true }
vitaminc-context = { version = "0.5.1", path = "../context" }
vitaminc-protected = { version = "0.5.1", path = "../protected" }

[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
