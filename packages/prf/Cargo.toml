[package]
name = "vitaminc-prf"
description = "Structured pseudorandom functions for the VitaminC cryptographic suite."
documentation = "https://docs.rs/vitaminc-prf"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
# `PrfValue` for `vitaminc_normalize::Normalized` and `EqualityTerm`: equality
# terms over the plaintext data model. Off, this crate depends on neither
# `vitaminc-normalize` nor its Unicode tables.
normalize = ["dep:vitaminc-normalize", "dep:vitaminc-aead"]

[dependencies]
vitaminc-normalize = { version = "0.5.1", path = "../normalize", optional = true }
vitaminc-aead = { version = "0.5.1", path = "../aead", optional = true }
mutants = "0.0.4"
thiserror = { workspace = true }
vitaminc-context = { version = "0.5.1", path = "../context" }
vitaminc-protected = { version = "0.5.1", path = "../protected" }

[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
