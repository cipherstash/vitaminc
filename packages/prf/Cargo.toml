[package]
name = "vitaminc-prf"
description = "Structured pseudorandom functions for the VitaminC cryptographic suite."
documentation = "https://docs.rs/vitaminc-prf"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# `PrfValue` for `&vitaminc_aead_value::Value` (canonical equality terms).
value = ["dep:vitaminc-aead-value"]
chrono = ["value", "vitaminc-aead-value/chrono"]
rust_decimal = ["value", "vitaminc-aead-value/rust_decimal"]

[dependencies]
vitaminc-aead-value = { version = "0.6.0", path = "../aead-value", features = ["canonical"], optional = true }
mutants = "0.0.4"
thiserror = { workspace = true }
vitaminc-context = { version = "0.6.0", path = "../context" }
vitaminc-protected = { version = "0.6.0", path = "../protected" }

[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
