[package]
name = "vitaminc-aead"
description = "Authenticated Encryption with Associated Data (AEAD) primitives. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-aead"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
vitaminc-aead-derive = { version = "0.6.1", path = "../aead-derive" }
vitaminc-context = { version = "0.6.1", path = "../context" }
vitaminc-protected = { version = "0.6.1", path = "../protected" }
vitaminc-random = { version = "0.6.1", path = "../random" }

bytes = { version = "^1", features = ["serde"] }
serde = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
# `stream::iter(..).buffered(..)` for the bounded per-leaf defaults of
# `AsyncCipher`'s `seal_many` and `open_many`. No runtime.
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }

# Optional `Encrypt` sources for logical types: a date and a timestamp,
# a decimal, and a uuid. Each is a few lines over the core model.
[dependencies.chrono]
version = "0.4.44"
default-features = false
features = ["std"]
optional = true

[dependencies.rust_decimal]
version = "1.41"
default-features = false
features = ["std"]
optional = true

[dependencies.uuid]
version = "1"
default-features = false
optional = true

[features]
chrono = ["dep:chrono"]
rust_decimal = ["dep:rust_decimal"]
uuid = ["dep:uuid"]
# Opt-in HList-based ciphertext shape. Trades the dynamic `Cipher::Ok` enum
# (heap-allocated `Vec`s, `Box<dyn Any>` passthrough) for a per-call typed
# builder where the full structural shape is encoded in the type system —
# no heap nodes, no type erasure, statically-typed passthrough access.
#
# Best suited to native Rust performance-sensitive paths; the dynamic
# default remains preferable for wasm32 / JS bindings where bundle size
# and runtime-determined shapes matter more.
hlist = []
# Not an API. Makes `plaintext::render`, the path notation tests assert
# against, reachable from sibling crates' tests. Only path-only
# dev-dependencies turn it on, so no published build has it.
test-support = []


[dev-dependencies]
# Path-only, so publish order does not matter: only the test that pins
# `into_aad` and `into_prf_context` to the same bytes needs the PRF crate.
vitaminc-prf = { path = "../prf" }
vitaminc-context = { path = "../context", features = ["arbitrary"] }
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
# Compile-fail tests for the derive macros' guards — see tests/derive_ui.rs.
trybuild = "1.0.118"
futures-executor = "0.3.31"
serde_json = "1"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
