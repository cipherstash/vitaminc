[package]
name = "vitaminc-aead"
description = "Authenticated Encryption with Associated Data (AEAD) primitives. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-aead"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vitaminc-protected = { version = "0.1.0-pre4.2", path = "../protected" }
vitaminc-random = { version = "0.1.0-pre4.2", path = "../random" }

bytes = { version = "^1", features = ["serde"] }
serde = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
vitaminc-encrypt = { version = "0.1.0-pre4.2", path = "../encrypt" } # Used only in doctests
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
