[package]
name = "vitaminc-normalize"
description = "Normalized equality terms for the plaintext data model. Part of the Vitamin-C cryptographic suite."
documentation = "https://docs.rs/vitaminc-normalize"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
vitaminc-aead = { version = "0.8.1", path = "../aead" }
vitaminc-protected = { version = "0.8.1", path = "../protected" }
thiserror = { workspace = true }

# NFC is stable for assigned code points, and the Unicode 16 assignment check
# refuses everything else, so newer normalization releases are safe.
[dependencies.unicode-normalization]
version = "0.1.24"

# Exact pin: this table defines which code points are assigned in Unicode 16,
# and a newer table would widen the accepted input of a frozen domain.
[dependencies.unicode-general-category]
version = "=1.1.0"

[dev-dependencies]
# Path-only, so publish order does not matter. `test-support` for
# `plaintext::render`, the path notation the tests assert against, so there
# is one copy of it.
vitaminc-aead = { path = "../aead", features = ["chrono", "rust_decimal", "uuid", "test-support"] }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false }
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
futures-executor = "0.3.31"

# The frozen release the decimal and float encodings were ported from, so
# the tests can check them byte for byte. It is not a dependency of the
# crate: ADR 0002 keeps `orderable-bytes` for cipherstash-client's stored
# terms and has vitaminc own its encodings.
orderable-bytes = { version = "=0.2.1", features = ["decimal"] }
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
