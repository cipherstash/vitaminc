
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.google.criteria-map]
does-not-implement-crypto = "does-not-implement-crypto"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.vitaminc]
audit-as-crates-io = false

[policy.vitaminc-aead]
audit-as-crates-io = false
dependency-criteria = { zeroize = ["safe-to-deploy", "crypto-reviewed"] }

[policy.vitaminc-aead-derive]
audit-as-crates-io = false

[policy.vitaminc-aead-frame]
audit-as-crates-io = false

[policy.vitaminc-aead-napi]
audit-as-crates-io = false
dependency-criteria = { zeroize = ["safe-to-deploy", "crypto-reviewed"] }

[policy.vitaminc-async-traits]
audit-as-crates-io = false

[policy.vitaminc-context]
audit-as-crates-io = false

[policy.vitaminc-encrypt]
audit-as-crates-io = false

[policy.vitaminc-encrypt.dependency-criteria]
aes-gcm = ["safe-to-deploy", "crypto-reviewed"]
aws-lc-rs = ["safe-to-deploy", "crypto-reviewed"]
zeroize = ["safe-to-deploy", "crypto-reviewed"]

[policy.vitaminc-hmac]
audit-as-crates-io = false

[policy.vitaminc-hmac.dependency-criteria]
hmac = ["safe-to-deploy", "crypto-reviewed"]
sha2 = ["safe-to-deploy", "crypto-reviewed"]
zeroize = ["safe-to-deploy", "crypto-reviewed"]

[policy.vitaminc-kms]
audit-as-crates-io = false
dependency-criteria = { zeroize = ["safe-to-deploy", "crypto-reviewed"] }

[policy.vitaminc-normalize]
audit-as-crates-io = false

[policy.vitaminc-ore]
audit-as-crates-io = false
dependency-criteria = { zeroize = ["safe-to-deploy", "crypto-reviewed"] }

[policy.vitaminc-password]
audit-as-crates-io = false

[policy.vitaminc-permutation]
audit-as-crates-io = false

[policy.vitaminc-permutation.dependency-criteria]
rand = ["safe-to-deploy", "crypto-reviewed"]
subtle = ["safe-to-deploy", "crypto-reviewed"]
zeroize = ["safe-to-deploy", "crypto-reviewed"]

[policy.vitaminc-prf]
audit-as-crates-io = false

[policy.vitaminc-protected]
audit-as-crates-io = false

[policy.vitaminc-protected.dependency-criteria]
digest = ["safe-to-deploy", "crypto-reviewed"]
subtle = ["safe-to-deploy", "crypto-reviewed"]
zeroize = ["safe-to-deploy", "crypto-reviewed"]

[policy.vitaminc-protected-derive]
audit-as-crates-io = false

[policy.vitaminc-random]
audit-as-crates-io = false

[policy.vitaminc-random.dependency-criteria]
chacha20 = ["safe-to-deploy", "crypto-reviewed"]
getrandom = ["safe-to-deploy", "crypto-reviewed"]
rand = ["safe-to-deploy", "crypto-reviewed"]
zeroize = ["safe-to-deploy", "crypto-reviewed"]

[policy.vitaminc-random-derives]
audit-as-crates-io = false

[policy.vitaminc-traits]
audit-as-crates-io = false
dependency-criteria = { zeroize = ["safe-to-deploy", "crypto-reviewed"] }

