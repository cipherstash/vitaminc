[[audits.portable-atomic]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
version = "1.15.0"
notes = "Full review of the published crate, in two halves. Build: build.rs, version.rs and src/gen/build.rs read in full; the script runs `$RUSTC -vV` (through RUSTC_WRAPPER when set), reads cargo and rustc environment variables, and prints rustc-cfg, check-cfg and rerun-if directives, with no file or network I/O, no generated code and no build-dependencies; process spawning under src/ is test-only. Core: every unsafe site in src/lib.rs (from_ptr, get_mut, into_inner, layout casts and Sync impls of the public atomics, with layouts checked statically), utils.rs, core_atomic.rs, float/, the crossbeam-derived seqlock fallback (every access atomic or under the lock) and the interrupt and critical-section guards with their inline asm (Armv6-M, pre-v7 Arm, AVR, MSP430, RISC-V, Xtensa). Architecture: every inline-asm module under src/imp/ read line by line (atomic128 on x86_64, aarch64, powerpc64, riscv64 and s390x; atomic64 on Arm Linux; arm_linux, riscv, msp430, avr, x86, float/aarch64, outline_atomics), checking operand constraints, register pairs, clobbers, fences against the LLVM lowerings and alignment preconditions, and decoding the hand-encoded LSE128, RCPC3 and Zacas words (the LSFE words in float/aarch64.rs were not decoded); atomic64/riscv32.rs was reviewed by diff against riscv64.rs, and atomic128/intrinsics.rs (Miri and TSan only) skimmed. Runtime CPU detection (getauxval, elf_aux_info, sysctl, IsProcessorFeaturePresent, getisax, zx_system_get_features, getsystemcfg, riscv_hwprobe) has correct FFI signatures and buffer sizes, reads no files or environment outside tests, and is cached by CAS so native and lock-based paths never mix. The unsafe-assume-single-core and unsafe-assume-privileged features are unsound if misused, are compile errors on hosted targets, and are off in our graph. jiff takes it with default-features = false, only on targets without pointer-width atomics. Sources match tag v1.15.0 (e4595528), published by trusted publishing from taiki-e/portable-atomic; upstream CI at that commit (QEMU across 42 targets, Miri, sanitizers, Valgrind, asm snapshots) passed. No advisories."

[[audits.portable-atomic-util]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
version = "0.2.8"
notes = 'Full review of the published crate. build.rs runs `$RUSTC -vV` through RUSTC_WRAPPER, reads environment variables and prints only rustc-cfg and check-cfg lines, with no file or network I/O. arc.rs read in full and compared with rust-lang/rust 1.93.0 alloc/src/sync.rs: every atomic operation and ordering in Arc and Weak (clone, drop, downgrade, is_unique, make_mut, get_mut, try_unwrap, into_inner, upgrade) matches std, and the layout arithmetic, from_raw and into_raw, allocation and deallocation pairing, panic guards, str, slice, Box and Vec conversions, downcast and the RawWaker vtable in task.rs are sound. Deviations from std, none unsound today: fat-pointer address replacement assumes the data pointer is the first word (utils.rs with_metadata_of); without std, abort() is a double panic; Weak::drop frees through Box<ArcInner<ManuallyDrop<T>>>; Weak raw-pointer APIs are sized only. tests/ and doc examples were not reviewed. Sources match the "Release 0.2.8" commit 6fb276ae of taiki-e/portable-atomic-util, the child of the trusted-publishing commit f0b9e652. No advisories.'

[[audits.proptest]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-run"
version = "1.12.0"
notes = "Reviewed the published crates.io package for use as a dev-dependency. No build script or network client. Reviewed manifest/features, proptest and assertion macro expansion, runner and shrink/rejection limits, RNG setup, config environment parsing, failure-persistence paths and append-only writes, fork replay and child handling, and the feature-gated unsafe panic-hook and hardware-RNG code. Environment access is for PROPTEST configuration; file writes are documented regression seeds and configured fork replay files; child execution is the test executable through rusty-fork. The password tests enable only std, leaving fork, timeout, hardware-rng, handle-panics and the optional proc macro disabled; their generated inputs contain only batch sizes, so persistence and diagnostic output contain no passwords. This is a safe-to-run review, not a cryptographic or randomness-quality certification. Agent-prepared review for approval in PR #592."

[[audits.rand_xorshift]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-run"
version = "0.5.0"
notes = "Reviewed the complete published src/lib.rs and Cargo manifests. no_std with forbid(unsafe_code), no build script, and no filesystem, environment, process or network access. The only required dependency is rand_core 0.10; optional serde supplies serialization. State updates are fixed integer shifts and XORs; seed conversion uses fixed-size arrays and rand_core utilities. from_rng and try_from_rng retry only all-zero seeds. Used transitively by Proptest to generate test inputs, never to generate application passwords. Safe-to-run only: XorShift is explicitly not a cryptographic RNG. Agent-prepared review for approval in PR #592."

