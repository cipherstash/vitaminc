
# cargo-vet audits file

[criteria.crypto-reviewed]
description = """
The cryptographic or secret-handling code in this crate, or in the delta
between the two versions, has been read by someone on the vitaminc team with
these questions in mind:

- Secret-dependent branches, memory accesses or division: anything that would
  make an operation's timing a function of key or plaintext bytes.
- Zeroization: buffers that hold secrets are wiped on drop, and no change
  leaves a copy behind (reallocation, Clone, Debug, serialisation).
- Randomness: how the RNG is seeded, where entropy comes from, and that no
  output is reused or made predictable.
- Algorithm and parameter changes: nonce sizes, tag lengths, key schedules,
  domain separation, anything that alters bytes on the wire or at rest.

It is required, on top of safe-to-deploy, for the crates vitaminc builds its
primitives on; see `dependency-criteria` in config.toml. It does not imply
safe-to-deploy: record both.
"""

[criteria.does-not-implement-crypto]
description = """
The crate implements no cryptographic algorithm and handles no key or
plaintext material of its own, so there is nothing for `crypto-reviewed` to
check: a build script, a proc macro, a collection type, an FFI shim. It
exists because criteria are transitive: requiring `crypto-reviewed` of
`aws-lc-rs` requires it of `cc` and `cmake` too, and this is how those are
answered without pretending anyone reviewed their cryptography. Google's
registry publishes audits under the same name, and they are imported as-is.
"""
implies = "crypto-reviewed"

[[audits.napi]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "3.14.2 -> 3.15.0"
notes = "Hunks map to napi-rs #3584, #3592, #3603, #3607, #3610, #3612, #3623 and #3626: memory-safety and leak fixes in class wrapping, native-borrow rooting, typed-array conversion and env teardown, plus ReadableStream cancel support. The new unsafe Send/Sync impls and the one napi_run_script of a constant three-line JS source were read and look sound. No new dependencies, no build.rs or FFI signature changes; Buffer and Uint8Array ownership paths are unchanged apart from a fixed reference leak on the error path."

[[audits.napi-sys]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "3.4.0 -> 3.4.1"
notes = "One doc-comment path fix in src/wasi_heap_sync.rs; no code change. build.rs unchanged."
