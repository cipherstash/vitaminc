[[package]]
name = "vitaminc-random-derives"
version_group = "vitaminc"

[[package]]
name = "vitaminc-traits"
version_group = "vitaminc"

# Test-only workspace members under packages/derive-tests/ (`publish = false`).
# Each pins one way a caller can depend on the vitaminc-protected derives. They
# are never released and are deliberately not in the version group above.
# `publish = false` here as well as `release = false`: without it they inherit
# `publish = true` from [workspace], which contradicts their Cargo.toml, and
# release-plz then refuses to release anything.
[[package]]
name = "derive-tests-direct"
release = false
publish = false

[[package]]
name = "derive-tests-override"
release = false
publish = false

[[package]]
name = "derive-tests-renamed"
release = false
publish = false

[[package]]
name = "derive-tests-umbrella-only"
release = false
publish = false
