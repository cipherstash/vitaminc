[workspace]
changelog_config = "cliff.toml"
git_tag_enable = true
git_release_enable = true
publish = true
semver_check = true
# Publish only when the commit on main is a merged release PR. Without this,
# every push to main publishes any version not yet on crates.io, so a crate
# added at the current version would be released straight from main.
release_always = false

# All packages release together as a single version group.
[[package]]
name = "vitaminc"
version_group = "vitaminc"

[[package]]
name = "vitaminc-aead"
version_group = "vitaminc"

[[package]]
name = "vitaminc-aead-derive"
version_group = "vitaminc"

[[package]]
name = "vitaminc-aead-napi"
version_group = "vitaminc"

[[package]]
name = "vitaminc-aead-frame"
version_group = "vitaminc"

[[package]]
name = "vitaminc-async-traits"
version_group = "vitaminc"

[[package]]
name = "vitaminc-context"
version_group = "vitaminc"

[[package]]
name = "vitaminc-encrypt"
version_group = "vitaminc"

[[package]]
name = "vitaminc-kms"
version_group = "vitaminc"

[[package]]
name = "vitaminc-normalize"
version_group = "vitaminc"

[[package]]
name = "vitaminc-ore"
version_group = "vitaminc"

[[package]]
name = "vitaminc-password"
version_group = "vitaminc"

[[package]]
name = "vitaminc-permutation"
version_group = "vitaminc"

[[package]]
name = "vitaminc-prf"
version_group = "vitaminc"

[[package]]
name = "vitaminc-hmac"
version_group = "vitaminc"

[[package]]
name = "vitaminc-protected"
version_group = "vitaminc"

[[package]]
name = "vitaminc-protected-derive"
version_group = "vitaminc"

[[package]]
name = "vitaminc-random"
version_group = "vitaminc"

[[package]]
name = "vitaminc-random-derives"
version_group = "vitaminc"

[[package]]
name = "vitaminc-traits"
version_group = "vitaminc"

# Test-only workspace members under packages/derive-tests/ (`publish = false`).
# Each pins one way a caller can depend on the vitaminc-protected derives. They
# are never released and are deliberately not in the version group above.
# `publish = false` here as well as `release = false`: without it they inherit
# `publish = true` from [workspace], which contradicts their Cargo.toml, and
# release-plz then refuses to release anything.
[[package]]
name = "derive-tests-direct"
release = false
publish = false

[[package]]
name = "derive-tests-override"
release = false
publish = false

[[package]]
name = "derive-tests-renamed"
release = false
publish = false

[[package]]
name = "derive-tests-umbrella-only"
release = false
publish = false
