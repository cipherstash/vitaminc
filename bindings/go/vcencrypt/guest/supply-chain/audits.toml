[[audits.thiserror]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "2.0.19 -> 2.0.21"
notes = "Maps to upstream 2.0.20 (#454) and 2.0.21 (#459): no runtime code change, src/lib.rs only bumps html_root_url, build.rs is byte-identical. MSRV rises from 1.71 to 1.77 for slice::last_chunk used in thiserror-impl; the remainder is CI matrix, a turbofish regression test, io::Error::other in tests, and regenerated UI .stderr files (the __private18 to __private20 rename comes from the unchanged build.rs deriving the module name from CARGO_PKG_VERSION_PATCH)."

[[audits.thiserror-impl]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "2.0.19 -> 2.0.21"
notes = "attr.rs adds turbofish-depth tracking to parse_token_expr so a `>` closing `::<...>` is not treated as a binary operator (#459, fixes #332); expand.rs adds #[allow(clippy::redundant_field_names)] to generated From impls (#454). Both are pure token-stream manipulation with no filesystem, environment, network or process access at expansion time; the depth counter is guarded against underflow. MSRV 1.71 to 1.77 for <[T]>::last_chunk."
