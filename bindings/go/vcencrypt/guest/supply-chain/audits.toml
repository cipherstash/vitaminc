
# cargo-vet audits file

[[audits.aws-lc-rs]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "1.17.3 -> 1.18.2"
notes = "Full read of the delta: ML-DSA stabilised out of unstable, RSA KeyPair::from_components validated with RSA_check_key, out-of-place AEAD seal_out_of_place_scatter with every buffer length checked before EVP_AEAD_CTX_seal_scatter, and 1.18.1's fail-closed tightening of seal_in_place_append_tag (post-Extend length verified before the FFI capacity is passed), streaming-cipher IV-context validation, and RSA digest-algorithm matching enforced on the ParsedPublicKey path. Zeroization only improved (ECDH agree returns Zeroizing<Vec<u8>>, KeyEncryptionKey zeroizes on drop); no change to rand/SystemRandom, AES-GCM, HMAC, nonce or tag handling, and the new branches are on public lengths only. No feature or build.rs change; aws-lc-sys moves 0.43 to 0.46 (AWS-LC 5.2 to 5.11, including the EVP_DecryptUpdate padded-mode fix the new canary tests pin) and is audited separately. One semantic change: hkdf::Salt::from(Okm<Algorithm>) now takes the Salt algorithm from the Okm's requested Algorithm rather than the PRK's; vitaminc does not use that path."

[[audits.aws-lc-sys]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "0.43.0 -> 0.46.0"
notes = "The vendored aws-lc/ tree is byte-identical to upstream AWS-LC v5.11.0 (fa9bc8d6; 0.43.0 was v5.2.0, 683ebde4), verified by diff -rq against shallow clones of both tags with the only differences being paths excluded by the crate's Cargo.toml include globs; the C and assembly delta was not read line by line. All Rust and build glue outside aws-lc/ was read in full: the build scripts gain size-opt defines (AWS_LC_SYS_SMALL, or opt-level s/z), DEP_AWS_LC_* metadata, Cranelift link-name normalisation and jitterentropy CFLAGS fixes, with no new network, download or filesystem access beyond OUT_DIR. src/*_crypto.rs are rust-bindgen 0.73.2 output whose non-declaration changes are identical across every target, with symbol additions matching the AWS-LC 5.4 to 5.10 APIs; generated-include changes are symbol-list only. The 26 prebuilt NASM objects match the aws-lc-rs repository blobs at tag aws-lc-sys/v0.46.0 and its documented CI generation workflow, but were not rebuilt from source here."

[[audits.libc]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "0.2.189 -> 0.2.190"
notes = "build.rs read in full (refactor to a Cfg enum with validate_cfg self-checks and new libc_unstable_time64, libc_elfv2 and uclibc32_time64 cfgs; only env reads and cargo: directives, with the pre-existing version probes now gated on target_os), as were Cargo.toml (exclude to include allow-list, no dependency or feature change), macros.rs (s2! and custom_struct! Default generators, f! absorbing safe_f!) and types.rs (transmute replaced by from_raw_parts, new const cstr). Every hunk with a function body, impl, unsafe, link or link_name change was read: FD_* gain explicit bounds panics, siginfo_t accessors move to proper union layouts, the unsound af_alg_iv trait impls are removed, the Hurd LFS dedup was verified against the shared unix/mod.rs declarations, and libutil is no longer linked on uclibc mips32; the remainder is bindings data across platforms including the new HelenOS target and Apple non-macOS removals. All changes map to the 0.2.190 changelog; no crypto-relevant symbol (getrandom, getentropy, mmap/mlock, explicit_bzero, arc4random, clock_gettime, sysconf) is removed or re-signed."

[[audits.libc]]
who = "Dan Draper <dan@cipherstash.com>"
criteria = "safe-to-deploy"
delta = "0.2.190 -> 0.2.191"
notes = "Full read of the 620-line diff. build.rs adds three Emscripten version-gated cfgs (fsblkcnt, sigset and nfds widths) in the same env-read and cargo:rustc-cfg shape as before; everything else is constants, struct definitions and extern declarations (Apple ifaliasreq/in6_aliasreq and the Mach API re-exposed on non-macOS, FreeBSD PT_* and the aarch64 gpregs/fpregs fix, Haiku, Hurd, NuttX, OpenBSD, QuRT and WASI additions, Android prop_info as an extern type). Every hunk maps to a 0.2.191 changelog entry; no dependency, feature or link change."

