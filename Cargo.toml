[workspace]
resolver = "2"
members = [
    "packages/aead",
    "packages/aead-derive",
    "packages/aead-napi",
    "packages/aead-frame",
    "packages/async-traits",
    "packages/context",
    "packages/derive-tests/direct",
    "packages/derive-tests/override",
    "packages/derive-tests/renamed",
    "packages/derive-tests/umbrella-only",
    "packages/encrypt",
    "packages/kms",
    "packages/normalize",
    "packages/ore",
    "packages/protected",
    "packages/protected-derive",
    "packages/password",
    "packages/permutation",
    "packages/prf",
    "packages/hmac",
    "packages/random",
    "packages/random-derives",
    "packages/traits",
    "packages/vitaminc",
]

[workspace.package]
documentation = "https://docs.rs/vitaminc"
version = "0.8.0"
repository = "https://github.com/cipherstash/vitaminc"
authors = [
  "Dan Draper <dan@cipherstash.com>",
]
edition = "2021"
# The floor for the workspace's own code. Crates that inherit this must build
# on it with their default features; a feature that pulls in a vendor SDK
# (vitaminc-kms's `aws`, `azure`, `gcp`, `vault`) may need a newer toolchain,
# and cargo reports which crate raised the bar when it does. The MSRV
# matrix in test.yml checks this floor and vitaminc-kms's higher one.
rust-version = "1.88.0"
homepage = "https://cipherstash.com"
license = "MIT"
keywords = ["cryptography", "security"]
categories = ["cryptography"]

[workspace.dependencies]
bitvec = "1.0.1"
rand = { version = "0.10.1", features = ["chacha"] }
thiserror = "2.0.18"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
