# Configuration for cargo-mutants — mutation testing for the vitaminc workspace.
#
# Mutation testing rewrites small pieces of logic (flip a `<` to `<=`, replace a
# body with `Default::default()`, etc.) and reruns the tests: a mutant that
# survives is a line the suite does not actually pin down. In a crypto library
# that is exactly the logic — comparisons, AAD handling, length checks — we most
# want a test to catch before it ships.
#
# CI runs this `--in-diff` as a per-PR gate (.github/workflows/mutants.yml): only
# the lines a PR changes are mutated, so the gate trips when a PR adds logic its
# tests don't exercise. `mise run mutants` runs the whole workspace locally.
# Both read the settings below, so they stay in sync.

# Build and test with every feature on, so feature-gated code — the `hlist`
# static-ciphertext API and the `_test-rust-crypto-backend` — is actually
# compiled and exercised. Without this, a mutant in that code would "survive"
# only because the gating feature was off, not because a test is missing.
additional_cargo_args = ["--all-features"]

# Skip `random-derives` and `protected-derive`: their expansion logic lives in
# the `#[proc_macro_derive]` entry points, which run at compile time rather than
# in the instrumented test binary, so every mutant there survives spuriously.
# This mirrors the cargo-crap `allow` list, and the same note applies: splitting
# the expansion out of the entry point — as `aead-derive` does — makes the logic
# directly testable, and mutable, so these two could come off this list.
exclude_globs = [
    "packages/protected-derive/**",
    "packages/random-derives/**",
    # `aead-derive` keeps only its four `#[proc_macro_derive]` shims in lib.rs —
    # those same-compile-time entry points, and nothing else. The expansion each
    # one delegates to lives in `plaintext.rs`/`typed_decrypt.rs` and is
    # mutated normally.
    "packages/aead-derive/src/lib.rs",
    # Kani proof harnesses: built only under `cfg(kani)`, so no test binary
    # ever contains them and every mutant there would survive spuriously.
    # The Kani gate (.github/workflows/kani.yml) is what checks this file.
    "packages/protected/src/locked/proofs.rs",
    "packages/aead-frame/src/storage/proofs.rs",
]

exclude_re = [
    # Equivalent mutants, not missing tests: `widen_f32` (vitaminc-normalize
    # scalar.rs) assembles an f64 by OR-ing bit fields that are disjoint by
    # construction — complementary masks, or fields shifted into separate bit
    # ranges — and for operands with no common set bit `a | b == a ^ b`, so no
    # input can tell the two apart. Only that one operator swap in that one
    # function is skipped; its other mutants (including `mantissa | 1`, where
    # the operands do overlap) stay gated.
    "replace \\| with \\^ in widen_f32",
    # The same equivalence in the decimal encoder (vitaminc-normalize
    # decimal.rs): every `|` in `orderable` and `strip_trailing_zeros` is a
    # branchless select, `(a & !mask) | (b & mask)`, whose halves are disjoint
    # by construction, or the nonzero idiom `x | -x`, whose top bit the swap
    # only changes for `x = 2^127`, outside the 96-bit mantissa the caller
    # admits. Anchored to those two functions; their other mutants stay gated,
    # and the port is checked byte for byte against the frozen crate besides.
    "replace \\| with \\^ in (orderable|strip_trailing_zeros)$",
    # Unreachable, not untested: `Nothing` (vitaminc-aead typed.rs) is an
    # uninhabited enum, so no value exists to call `scalar`, `typed_null` or
    # `passthrough` on and replacing any of those bodies with `Ok(())` cannot
    # be observed. Its `seq` and `map` mutants are unviable for the same
    # reason.
    "replace <impl Sink for Nothing>::(scalar|typed_null|passthrough) ",
    # Equivalent mutant: `max` (vitaminc-aead plaintext/depth.rs) picks the
    # larger of two depths, and when they are equal `a > b` and `a >= b`
    # return the same number, so no input can tell them apart.
    # (`Ord::max` is not a `const fn`, so the comparison has to be written
    # out.) Its other mutants stay gated.
    "packages/aead/src/plaintext/depth.rs:.*replace > with >= in max",
    # Equivalent mutant: `null` (vitaminc-normalize scalar.rs) returns the
    # one byte `0x00` in a protected vector, which is exactly what the
    # replacements `Protected::new(vec![0])` and `Protected::from(vec![0])`
    # return, so no input can tell them apart. Its other replacements
    # (`vec![]`, `vec![1]`) stay gated, and the byte is pinned by the
    # known-answer tests and the HMAC vector for the null domain.
    "packages/normalize/src/scalar.rs:.*replace null -> Protected<Vec<u8>> with Protected::(new|from)\\(vec!\\[0\\]\\)",
    # Equivalent mutant: `Nulls::target` (vitaminc-ore target.rs) returns
    # the marker the policy is set on, and every marker it can hold is a
    # fixed-width marker, a zero-sized type with one value, which is also
    # what `Default::default()` returns. No input can tell them apart. Its
    # sibling `RuntimeNulls::target` holds an `OrderTarget` and stays gated.
    "packages/ore/src/target.rs:.*replace Nulls<T, P>::target -> T with Default::default\\(\\)",
]

# Property tests (quickcheck) and AEAD round-trips run slower under mutation than
# a clean build, so give each mutant generous headroom over the measured baseline
# before declaring a timeout — a slow-but-correct mutant must not be misreported
# as surviving (which would fail the gate spuriously).
timeout_multiplier = 5.0
minimum_test_timeout = 90
