# Legacy explicit selector, needed by `getrandom 0.3.0–0.3.3`.
# `vitaminc-random` uses getrandom 0.4 and enables `wasm_js`, which selects
# the JavaScript backend without this flag. Consumers of vitaminc-random
# and vitaminc-encrypt do not need to copy this configuration.
# See: https://docs.rs/getrandom/0.4.3/getrandom/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
