name: "Set up Kani"
description: "Install the pinned Kani verifier, its nightly and CBMC, cached between runs. Used by kani.yml and kani-storage.yml, so a version bump is one edit."

inputs:
  version:
    description: "The kani-verifier version."
    # The one pin for every Kani workflow.
    default: "0.67.0"
  cache-name:
    description: "Names this workflow's cache. Each workflow proves a different crate and fetches different crates for it, so each keeps its own cache: a shared one would be saved by whichever ran first, and miss the other's crates."
    required: true

runs:
  using: "composite"
  steps:
    # One cache per workflow (`cache-name`): it holds the pinned Kani and
    # the crates that workflow's proofs fetch. An exact hit is never saved
    # again, so a cache shared between workflows that fetch different
    # crates would keep missing some of them until the lockfile changed.
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/cargo-kani
          ~/.cargo/bin/kani
          ~/.kani/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-kani-${{ inputs.cache-name }}-${{ inputs.version }}-${{ hashFiles('**/Cargo.lock') }}

    - name: setup rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: install kani
      # A plain `cargo install`, like the mutants and crap gates, rather
      # than the Kani GitHub Action the org allowlist may not permit. Kani
      # installs its own pinned nightly and CBMC on first use (`cargo kani
      # setup`, a few minutes); the cache keeps that between runs.
      shell: bash
      env:
        KANI_VERSION: ${{ inputs.version }}
      run: |
        # A fixed-string, whole-word match, so a cached 10.67.0 or 0.67.01
        # is not taken for 0.67.0.
        if ! cargo kani --version 2>/dev/null | grep -qwF "$KANI_VERSION"; then
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
        fi
