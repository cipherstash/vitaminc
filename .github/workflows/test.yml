name: "Test"
on:
  push:
    branches:
      - main
  # No branch filter: a stacked PR (a feature branch as base) must run this
  # gate too. With `branches: [main]` here, retargeting a PR onto its
  # parent branch silently switched every Rust gate off; see go.yml.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    runs-on: ubuntu-latest
    name: "🧪 Test"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust
        # Pinned, not `@stable`: the trybuild cases under
        # packages/hmac/tests/ui compare rustc diagnostics verbatim, and a
        # stable release that rewords a diagnostic would fail unrelated PRs.
        # When bumping, regenerate the pinned output with
        # `TRYBUILD=overwrite cargo test -p vitaminc-hmac`.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.3.2
        with:
          image-tag: 'latest'
          install-awslocal: 'true'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: clippy (all features)
        # `--all-features` enables `_test-rust-crypto-backend`, which selects
        # the RustCrypto encrypt backend on native. The step below covers the
        # aws-lc-rs path that this configuration leaves unchecked.
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings

      - name: clippy (vitaminc-encrypt, aws-lc-rs backend)
        run: cargo clippy --no-deps -p vitaminc-encrypt --all-targets -- -D warnings

      - name: clippy (vitaminc-encrypt, wasm32)
        run: cargo clippy --no-deps --target wasm32-unknown-unknown -p vitaminc-encrypt --tests -- -D warnings

      - name: format
        run: cargo fmt -- --check

      # Broken intra-doc links are invisible without this: rustdoc warns and
      # exits 0, so a link to a renamed or newly-private item rots silently and
      # ships to docs.rs. `--no-deps` keeps the gate to our own crates.
      - name: docs (intra-doc links)
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: test (default — aws-lc-rs backend)
        run: cargo test

      - name: test (vitaminc-encrypt, RustCrypto backend on native)
        # Forces the RustCrypto path that wasm32 uses, so the same property
        # tests run against both backends in CI.
        run: cargo test -p vitaminc-encrypt --features _test-rust-crypto-backend

      - name: test (hlist static-ciphertext feature)
        # The `hlist` feature gates the static-ciphertext API and is NOT in the
        # default set, so plain `cargo test` above never builds or runs it. The
        # behaviour tests all live in encrypt's `cipher_static` (round-trip /
        # wrong-key / tamper / nondeterminism); aead's `hlist` module has no
        # tests of its own, so `-p vitaminc-aead` only compile-checks it here
        # (encrypt/hlist pulls in aead/hlist transitively).
        run: cargo test -p vitaminc-aead -p vitaminc-encrypt --features vitaminc-encrypt/hlist

      - name: test (hlist static-ciphertext, RustCrypto backend)
        # The step above exercises `cipher_static` only against aws-lc-rs. Run it
        # against the RustCrypto backend too — the path wasm/JS consumers use —
        # mirroring the two-backend coverage the `_test-rust-crypto-backend` step
        # gives the main cipher. The wasm test job can't cover this: the
        # `cipher_static` tests are `#[cfg(not(target_arch = "wasm32"))]`.
        run: cargo test -p vitaminc-encrypt --features hlist,_test-rust-crypto-backend

      - name: build check (vitaminc-encrypt, wasm32)
        run: cargo check --target wasm32-unknown-unknown -p vitaminc-encrypt

      - name: install wasm-pack
        # Inline via the official install script — avoids depending on a
        # third-party GitHub Action that the org actions allowlist may not
        # permit.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: test (vitaminc-encrypt, wasm32 in Node)
        # Compiles to wasm32-unknown-unknown and runs tests inside Node — this
        # is what gates the *actual* wasm codegen path (the native
        # `_test-rust-crypto-backend` step above is just a proxy).
        run: wasm-pack test --node packages/encrypt
