name: "Test"
on:
  push:
    branches:
      - main
  # No branch filter: a stacked PR (a feature branch as base) must run this
  # gate too. With `branches: [main]` here, retargeting a PR onto its
  # parent branch silently switched every Rust gate off; see go.yml.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  # Enforces the declared rust-version: the workspace MSRV (root Cargo.toml)
  # and vitaminc-kms's own, higher floor (the AWS SDK moves faster than the
  # rest, so kms declares its own rust-version and is checked separately).
  # This job only runs `cargo check`. Tests stay on the pinned release in the
  # `test` job below, because the trybuild `.stderr` snapshots match one
  # compiler's diagnostics verbatim and would fail on any other.
  # `--locked` makes it check the dependency graph we actually ship.
  msrv:
    runs-on: ubuntu-latest
    name: "🦀 MSRV (${{ matrix.toolchain }}, ${{ matrix.name }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace
            toolchain: 1.88.0
            args: --workspace --all-targets --exclude vitaminc-kms
          - name: vitaminc-kms
            toolchain: 1.94.1
            args: -p vitaminc-kms --all-targets

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: cargo check
        run: cargo check --locked ${{ matrix.args }}

  # The storage profile's golden corpus pins bytes customers keep, so a row
  # it had is never edited or removed; rows may be added. The Rust test
  # holds the code to the corpus, and this holds the corpus to itself. See
  # packages/aead-frame/scripts/storage_corpus_append_only.py.
  storage-corpus:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: "📼 Storage corpus only grows"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The check reads the corpus at the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: test the check
        run: python3 -m unittest discover -s packages/aead-frame/scripts -p 'test_storage_corpus_append_only.py'

      - name: check the corpus
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 packages/aead-frame/scripts/storage_corpus_append_only.py --base "origin/$BASE_REF"

  test:
    runs-on: ubuntu-latest
    name: "🧪 Test"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust
        # Pinned, not `@stable`: the trybuild cases under every crate's
        # tests/ui (vitaminc-hmac, vitaminc-ore, and the others with that
        # directory) compare rustc diagnostics verbatim, and a stable
        # release that rewords a diagnostic would fail unrelated PRs. When
        # bumping, regenerate the pinned output in each with
        # `TRYBUILD=overwrite cargo test -p <crate>`.
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@v0.3.2
        with:
          image-tag: 'latest'
          install-awslocal: 'true'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: clippy (all features)
        # `--all-features` enables `_test-rust-crypto-backend`, which selects
        # the RustCrypto encrypt backend on native. The step below covers the
        # aws-lc-rs path that this configuration leaves unchecked.
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings

      - name: clippy (vitaminc-encrypt, aws-lc-rs backend)
        run: cargo clippy --no-deps -p vitaminc-encrypt --all-targets -- -D warnings

      - name: clippy (vitaminc-encrypt, wasm32)
        run: cargo clippy --no-deps --target wasm32-unknown-unknown -p vitaminc-encrypt --tests -- -D warnings

      - name: format
        run: cargo fmt -- --check

      # The release workflow runs these scripts on main only, so their first
      # real run would be after a change to them merged. The config test
      # catches a workspace member that release-plz.toml would try to
      # publish although the crate is not publishable, which fails every
      # Release run and nothing else checks.
      - name: release lockfile re-sync and release-plz config (script tests)
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_sync_nested_lockfiles.py'
          python3 -m unittest discover -s .github/scripts -p 'test_commit_on_branch.py'
          python3 -m unittest discover -s .github/scripts -p 'test_release_plz_config.py'

      # Broken intra-doc links are invisible without this: rustdoc warns and
      # exits 0, so a link to a renamed or newly-private item rots silently and
      # ships to docs.rs. `--no-deps` keeps the gate to our own crates.
      - name: docs (intra-doc links)
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: test (default — aws-lc-rs backend)
        # This host locks memory for real (no sanitizer, not root), so the
        # `Locked` tests are told to require it: a case that would skip
        # elsewhere fails here, and a regression that never took a lock
        # cannot pass every job. The soft limit is raised to the hard one
        # first; every `Locked` value costs a page of it.
        env:
          LOCKED_TESTS_REQUIRE_LOCK: "1"
        run: |
          ulimit -l "$(ulimit -H -l)" || true
          echo "RLIMIT_MEMLOCK soft: $(ulimit -l) KiB"
          cargo test

      - name: test (aead optional scalar features)
        # Only dev-dependencies enable these on vitaminc-aead, so a build
        # of the crate alone skips the tests that pin the chrono,
        # rust_decimal and uuid conversions and range constants. Run each
        # alone and together.
        run: |
          cargo test -p vitaminc-aead --features chrono &&
          cargo test -p vitaminc-aead --features rust_decimal &&
          cargo test -p vitaminc-aead --features uuid &&
          cargo test -p vitaminc-aead --all-features

      - name: test (aead-frame serde feature)
        # No workspace member enables `vitaminc-aead-frame/serde`, so the
        # workspace run skips the serde format's tests and doctest, and the
        # storage profile's, which hold the code to its golden corpus.
        run: cargo test -p vitaminc-aead-frame --features serde

      - name: test (equality term feature)
        # The workspace run unifies hmac's dev-dependency features, so test
        # prf alone without `normalize` as well as with it, and check that
        # the facade's `normalize` and `ore` features forward on their own.
        run: |
          cargo test -p vitaminc-prf &&
          cargo test -p vitaminc-prf --features normalize &&
          cargo test -p vitaminc-hmac --test normalized_equality &&
          cargo test -p vitaminc --features prf,normalize --test prf_normalize &&
          cargo check -p vitaminc --features ore

      - name: test (vitaminc-encrypt, RustCrypto backend on native)
        # Forces the RustCrypto path that wasm32 uses, so the same property
        # tests run against both backends in CI.
        run: cargo test -p vitaminc-encrypt --features _test-rust-crypto-backend

      - name: test (Node conversion kind inventory)
        # `cargo test -p vitaminc-aead-napi` above runs this suite too, with
        # the others, against the test addon it builds; this step runs it on
        # its own so a missing kind fails with the inventory's own message.
        run: |
          cargo build --locked --manifest-path packages/aead-napi/tests/addon/Cargo.toml &&
          cp packages/aead-napi/tests/addon/target/debug/libvitaminc_napi_test_addon.so packages/aead-napi/tests/addon/addon.node &&
          node packages/aead-napi/tests/kind_inventory.cjs packages/aead-napi/tests/addon/addon.node

      - name: test (hlist static-ciphertext feature)
        # The `hlist` feature gates the static-ciphertext API and is NOT in the
        # default set, so plain `cargo test` above never builds or runs it. The
        # behaviour tests all live in encrypt's `cipher_static` (round-trip /
        # wrong-key / tamper / nondeterminism); aead's `hlist` module has no
        # tests of its own, so `-p vitaminc-aead` only compile-checks it here
        # (encrypt/hlist pulls in aead/hlist transitively).
        run: cargo test -p vitaminc-aead -p vitaminc-encrypt --features vitaminc-encrypt/hlist

      - name: test (hlist static-ciphertext, RustCrypto backend)
        # The step above exercises `cipher_static` only against aws-lc-rs. Run it
        # against the RustCrypto backend too — the path wasm/JS consumers use —
        # mirroring the two-backend coverage the `_test-rust-crypto-backend` step
        # gives the main cipher. The wasm test job can't cover this: the
        # `cipher_static` tests are `#[cfg(not(target_arch = "wasm32"))]`.
        run: cargo test -p vitaminc-encrypt --features hlist,_test-rust-crypto-backend

      - name: build check (vitaminc-encrypt, wasm32)
        run: cargo check --target wasm32-unknown-unknown -p vitaminc-encrypt

      - name: install wasm-pack
        # Inline via the official install script — avoids depending on a
        # third-party GitHub Action that the org actions allowlist may not
        # permit.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: test (vitaminc-encrypt, wasm32 in Node)
        # Compiles to wasm32-unknown-unknown and runs tests inside Node — this
        # is what gates the *actual* wasm codegen path (the native
        # `_test-rust-crypto-backend` step above is just a proxy).
        run: wasm-pack test --node packages/encrypt
