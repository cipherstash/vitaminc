name: "Kani"

# Proves, rather than tests, the invariants the `Locked` region code relies
# on: for every page size, value size and alignment within the stated
# bounds, the value lies inside the interior, aligned, against the trailing
# guard; the mapping length is the interior plus two guards; and the wipe
# touches exactly the bytes it is given. The harnesses live in
# packages/protected/src/locked/proofs.rs and build only under `cfg(kani)`;
# the four of them verify in well under a minute.
#
# Kani is installed by .github/actions/setup-kani, which holds the version
# pin and the cache both Kani workflows share.
on:
  # No branch filter: a stacked PR (a feature branch as base) must run this
  # gate too; see go.yml.
  pull_request:
    paths:
      - "packages/protected/**"
      - ".github/workflows/kani.yml"
      - ".github/actions/setup-kani/**"
      - "!**.md"

  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: kani-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  kani:
    runs-on: ubuntu-latest
    name: "📐 Kani (proofs)"

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-kani

      - name: prove (vitaminc-protected)
        run: cargo kani -p vitaminc-protected
