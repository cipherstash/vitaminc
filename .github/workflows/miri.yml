name: "Miri"

# Runs the vitaminc-protected test suite under Miri to detect undefined
# behaviour in the crate's `unsafe` code.
#
# `vitaminc-protected` is the only crate in the workspace with first-party
# `unsafe`: the move-out in `move_inner_out` (`ptr::read` + `mem::forget`), which
# is how `risky_unwrap` / `flatten` / `transpose` move the inner secret out past
# the zeroizing `Drop`. Miri interprets the tests under the Stacked/Tree Borrows
# model, catching aliasing/provenance UB that a normal test run (and even ASan)
# can miss.
#
# Scoped to `vitaminc-protected` on purpose: Miri can't execute the aws-lc-rs
# FFI (vitaminc-encrypt) or the entropy syscalls in random/permutation/password,
# and `protected` is where the only unsafe lives. Expand the matrix if other
# crates grow pure-Rust `unsafe`.
on:
  # No branch filter: a stacked PR (a feature branch as base) must run this
  # gate too. With `branches: [main]` here, retargeting a PR onto its
  # parent branch silently switched every Rust gate off; see go.yml.
  pull_request:
    paths:
      - "packages/protected/**"
      - ".github/workflows/miri.yml"
      - "!**.md"

  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

# Cancel an in-flight run when the PR is pushed again — only the latest matters.
concurrency:
  group: miri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    runs-on: ubuntu-latest
    name: "🔬 Miri (unsafe check)"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}

      - name: setup rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: miri test (vitaminc-protected)
        # Interprets the protected unit tests + doctests under Miri: the
        # move-out in `move_inner_out`, and the `Locked` region code, which
        # Miri runs on the real `mmap`-backed Unix backend (only `mprotect`,
        # `mlock` and `madvise` are skipped, having no Miri model). The first
        # run builds a Miri sysroot (a few minutes); cached runs are quick.
        run: cargo +nightly miri test -p vitaminc-protected

      - name: miri test, strict models (vitaminc-protected)
        # The same suite under Tree Borrows instead of Stacked Borrows, with
        # strict provenance (no integer-to-pointer casts may be dereferenced)
        # and symbolic alignment (alignment judged from the allocation, not
        # the address). Each model rejects code the default run accepts, and
        # the region code lives on raw pointers, so it must satisfy all of
        # them.
        env:
          MIRIFLAGS: "-Zmiri-tree-borrows -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check"
        run: cargo +nightly miri test -p vitaminc-protected --target-dir target/miri-strict
