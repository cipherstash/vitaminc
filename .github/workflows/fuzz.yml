name: "Fuzz"
on:
  # PR CI runs the fuzz targets over their seed corpora only (go.yml). This
  # job spends real time mutating inputs, off the PR path so a slow or
  # unlucky run never blocks a merge.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per fuzz target (Go duration)"
        default: "5m"

defaults:
  run:
    shell: bash -l {0}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    name: "🐹 Go codec fuzzing"
    strategy:
      fail-fast: false
      matrix:
        # `go test -fuzz` runs one target per invocation.
        target: [FuzzUnmarshal, FuzzUnmarshalCipherText]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/vcencrypt/go.mod
          cache-dependency-path: |
            bindings/go/vcencrypt/go.sum
            bindings/go/vcencrypt/examples/go.sum

      - name: fuzz ${{ matrix.target }}
        working-directory: bindings/go/vcffi
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: CGO_ENABLED=0 go test -run='^$' -fuzz="^${{ matrix.target }}\$" -fuzztime="$FUZZTIME" .

      - name: upload failing input
        # A failure writes the minimized input under testdata/fuzz. Commit it
        # there to keep it as a regression seed for every PR run.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: bindings/go/vcffi/testdata/fuzz

  report:
    # A scheduled run has no PR to turn red, so a failure would otherwise sit
    # unseen in the Actions tab. Record it on one standing issue instead: it
    # notifies repository watchers and stays visible until someone closes it.
    # Manual runs skip this; whoever started one is already watching it.
    needs: go
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    name: "📣 Report fuzz failure"
    permissions:
      issues: write
    steps:
      - name: open or update the fuzz failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create fuzz --color B60205 \
            --description "Failure found by the nightly fuzz workflow" --force
          body="The nightly fuzz run failed: $RUN_URL

          The failing input is attached to that run as a \`fuzz-<target>\`
          artifact. Commit it under \`bindings/go/vcffi/testdata/fuzz\` so every
          PR run replays it, fix the bug, then close this issue."
          issue=$(gh issue list --label fuzz --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Nightly fuzzing found a failure" --label fuzz --body "$body"
          fi
