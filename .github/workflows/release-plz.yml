name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# Both jobs run in the `release` environment, which only `main` may use. A
# workflow runs from whichever branch triggered it, so without it, a branch
# whose copy of this file runs on that branch would get what these jobs get:
#
# - RELEASE_PLZ_APP_PRIVATE_KEY, which is an environment secret, so a job
#   outside `release` cannot read it;
# - an OIDC token crates.io accepts. Only the Release job asks for one, and
#   its token names the environment; every crate's trusted publisher
#   requires `release`, so a token from anywhere else is refused.
#
# Removing `environment:` from a branch's copy gains nothing: the job then
# gets neither the secret nor a token crates.io accepts.
jobs:
  release-plz-pr:
    name: "Release PR"
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Two test workspaces keep their own lockfiles, which pin the workspace
      # crates by version and which release-plz does not update: the Node
      # addon (built with --locked, so a stale pin fails CI) and the Go
      # bindings' wasm guest. Re-sync both, managed README dependency versions,
      # and documented MSRVs on the release branch after every regeneration.
      #
      # The PR comes from release-plz's own output (set whether it opened
      # the PR or updated it), not from a search: GitHub's search index lags
      # a just-opened PR, so a search right after would miss it.
      #
      # This step holds a token that can push, so it trusts nothing on the
      # branch. release-plz picks its PR by branch prefix alone, so the step
      # checks the PR is open against main, from this repository, and by the
      # release-plz app, never a fork's or anyone else's `release-plz-*`
      # branch. And it runs no cargo there, which would honour the branch's
      # .cargo/config.toml: main's scripts edit lockfiles and documentation as
      # data in a separate worktree, so nothing from the branch executes.
      - name: Re-sync lockfiles and documentation on the release branch
        if: steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ fromJSON(steps.release-plz.outputs.pr).number }}
        run: |
          branch=$(gh pr view "$PR_NUMBER" \
            --json state,baseRefName,isCrossRepository,author,headRefName \
            --jq 'select(.state == "OPEN" and .baseRefName == "main"
                    and (.isCrossRepository | not)
                    and .author.login == "app/cipherstash-release-plz"
                    and (.headRefName | startswith("release-plz-"))) | .headRefName')
          if [ -z "$branch" ]; then
            echo "PR #$PR_NUMBER is not release-plz's own release PR; not re-syncing" >&2
            exit 1
          fi
          git fetch origin "refs/heads/$branch"
          release="$RUNNER_TEMP/release-branch"
          git worktree add "$release" FETCH_HEAD
          python3 .github/scripts/sync_nested_lockfiles.py "$release"
          python3 .github/scripts/sync_readme_versions.py "$release"
          python3 .github/scripts/sync_msrv.py "$release"
          if git -C "$release" diff --quiet; then exit 0; fi
          # main requires signed commits, and a commit made here with git and
          # pushed is unsigned. GitHub signs a commit it creates through the
          # API, attributed to the release-plz app: a `[bot]` login, which
          # release-plz needs on every commit after the first, or it closes
          # and reopens the release PR on every push to main. The commit's
          # parent is the head fetched above, so a branch that moved since is
          # refused rather than overwritten.
          python3 .github/scripts/commit_on_branch.py "$release" "$GITHUB_REPOSITORY" "$branch" \
            "chore: sync lockfiles and documentation versions" \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url'

  release-plz-release:
    name: "Release"
    runs-on: ubuntu-latest
    environment: release
    # Job-level permissions replace the workflow's, so restate them. Only
    # this job publishes, so only it can ask for an OIDC token.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
