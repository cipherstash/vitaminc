name: Release-plz

# Releases take two steps, in two jobs on every push to main:
#
# - Release PR: sampo turns the pending changesets (.sampo/changesets/*.md)
#   into the next version and each crate's changelog, and this job commits
#   that to the `release/main` branch and opens or updates its PR.
# - Release: once that PR merges, release-plz publishes every crate not yet
#   on crates.io, tags it and makes its GitHub release.
#
# THE FILENAME CANNOT CHANGE: crates.io trusted publishing binds the
# publisher to it.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-pr:
    name: "Release PR"
    runs-on: ubuntu-latest
    # Each run rebuilds the release from main, so only the newest matters.
    concurrency:
      group: release-pr
      cancel-in-progress: true
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      # Same curl-pipe install as crap.yml, so the org actions allowlist need
      # not admit a third-party install action. sampo is pinned: a new
      # version can change what a release writes.
      - name: Install sampo and cargo-semver-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y sampo@0.22.0 cargo-semver-checks

      # Everything from here runs on main's own checkout, never on the
      # release branch, so nothing a release branch holds (its
      # .cargo/config.toml, say) runs while this job holds a token that can
      # push. sampo exits 2 when there are no changesets to release.
      - name: Apply the pending changesets
        id: sampo
        run: |
          status=0
          sampo release || status=$?
          case "$status" in
            0) echo "pending=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "No pending changesets, so no release to prepare." ;;
            *) exit "$status" ;;
          esac

      # sampo explains every lockstep bump in every changelog ("Bumped due to
      # fixed dependency group policy", "Updated dependencies: ..."), with no
      # setting to stop it; tidy_changelogs.py drops those lines and prints
      # the release notes for the PR. The two test workspaces' lockfiles pin
      # the workspace crates by version and sampo does not update them.
      - name: Tidy the changelogs and re-sync the nested lockfiles
        if: steps.sampo.outputs.pending == 'true'
        run: |
          python3 .github/scripts/tidy_changelogs.py . > "$RUNNER_TEMP/notes.md"
          python3 .github/scripts/sync_nested_lockfiles.py .

      # A changeset's bump is the author's call. cargo-semver-checks compares
      # each crate's API with its last release on crates.io and says whether
      # the new version covers the change; a patch release that breaks the
      # API fails here. It does not block the PR: the result goes in the PR
      # body for the person who merges it.
      - name: Check the version against the API change
        if: steps.sampo.outputs.pending == 'true'
        id: semver
        run: |
          if cargo semver-checks --workspace > "$RUNNER_TEMP/semver.txt" 2>&1; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      # main requires signed commits, and a commit made here with git and
      # pushed is unsigned. GitHub signs a commit it creates through the API
      # (createCommitOnBranch), attributed to the app. That commit has to
      # land on a branch already at main's head, and pointing `release/main`
      # itself at main's head would show its open PR as merged, so the commit
      # is made on a staging branch and `release/main` is then moved to it.
      # Its parent is main's head, so a staging branch that moved in between
      # is refused rather than overwritten.
      - name: Commit the release and open or update its PR
        if: steps.sampo.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SEMVER: ${{ steps.semver.outputs.result }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          title="chore: release v$version"
          staging=sampo-staging/main
          git push --force origin "HEAD:refs/heads/$staging"
          commit=$(python3 .github/scripts/commit_on_branch.py . "$GITHUB_REPOSITORY" "$staging" "$title" \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid')
          git fetch origin "refs/heads/$staging"
          test "$(git rev-parse FETCH_HEAD)" = "$commit"
          git push --force origin "$commit:refs/heads/release/main"
          git push origin --delete "$staging"

          body="$RUNNER_TEMP/body.md"
          {
            echo "Releases every crate at **$version**, from the changesets merged since the last release."
            echo
            echo "Review the entries below as the changelog readers will see them. To change one, edit its changeset on main (or add one) and this PR is rebuilt; edits to this branch are lost on the next push to main."
            echo
            if [ "$SEMVER" = passed ]; then
              echo "**cargo-semver-checks:** passed. Every crate's version covers its API change."
            else
              echo "**cargo-semver-checks:** failed. A crate's API changed more than its version says, or the check could not run. Read the output below before merging."
              echo
              echo '<details><summary>Output</summary>'
              echo
              echo '```'
              tail -n 60 "$RUNNER_TEMP/semver.txt"
              echo '```'
              echo
              echo '</details>'
            fi
            echo
            echo "## Changes"
            echo
            if [ -s "$RUNNER_TEMP/notes.md" ]; then cat "$RUNNER_TEMP/notes.md"; else echo "No crate has a changelog entry."; fi
          } > "$body"

          pr=$(gh pr list --head release/main --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$body"
          else
            gh pr create --head release/main --base main --title "$title" --body-file "$body"
          fi

  release-plz-release:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
