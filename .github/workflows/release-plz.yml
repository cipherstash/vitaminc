name: Release-plz

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-plz-pr:
    name: "Release PR"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Two test workspaces keep their own lockfiles, which pin the workspace
      # crates by version and which release-plz does not update: the Node
      # addon (built with --locked, so a stale pin fails CI) and the Go
      # bindings' wasm guest. Re-sync both on the release branch after every
      # regeneration.
      #
      # This step holds a token that can push, so it trusts nothing on the
      # branch. It takes only the open PR that release-plz itself opened from
      # this repository, never a fork's or anyone else's `release-plz-*`
      # branch. And it runs no cargo there, which would honour the branch's
      # .cargo/config.toml: main's script edits the lockfiles as text, in a
      # separate worktree, so nothing from the branch executes.
      - name: Re-sync the nested lockfiles on the release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # --author is applied by GitHub's search, so only release-plz's own
          # PRs come back; --limit lifts gh's default cap of 30 all the same.
          branch=$(gh pr list --state open --base main --author "app/cipherstash-release-plz" \
            --limit 100 --json headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not) | select(.headRefName | startswith("release-plz-"))][0].headRefName // empty')
          if [ -z "$branch" ]; then exit 0; fi
          git fetch origin "refs/heads/$branch"
          release="$RUNNER_TEMP/release-branch"
          git worktree add "$release" FETCH_HEAD
          python3 .github/scripts/sync_nested_lockfiles.py "$release"
          cd "$release"
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: re-sync the nested lockfiles to the release version"
          git push origin "HEAD:refs/heads/$branch"

  release-plz-release:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
