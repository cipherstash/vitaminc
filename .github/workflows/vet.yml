name: "Vet"
on:
  push:
    branches:
      - main
  # No branch filter, for the same reason as test.yml: a stacked PR must run
  # this gate too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Holds Cargo.lock to supply-chain/: every third-party crate version is
  # either audited (ours, or imported from a registry we trust), or listed as
  # an exemption. A dependabot bump fails here until someone records the
  # audit of the delta, which is the review step. `--locked` reads
  # imports.lock as committed rather than fetching the registries, so the
  # result depends only on the tree.
  vet:
    runs-on: ubuntu-latest
    name: "🔏 cargo vet"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup rust
        # Only for `cargo metadata`; no code is built.
        uses: dtolnay/rust-toolchain@stable

      - name: install cargo-vet
        # A pinned release tarball with its checksum, as deny.yml does. The
        # digest is the one GitHub publishes for the release asset. When
        # bumping, update both values together.
        env:
          VERSION: "0.10.3"
          SHA256: "e83878b80913fbe43629c28768e14ab51f4e86a4ba8f9dd08cc25b8dbc503c19"
        run: |
          set -euo pipefail
          asset="cargo-vet-x86_64-unknown-linux-gnu"
          curl -sSfL -o cargo-vet.tar.xz \
            "https://github.com/mozilla/cargo-vet/releases/download/v${VERSION}/${asset}.tar.xz"
          echo "${SHA256}  cargo-vet.tar.xz" | sha256sum -c -
          tar -xJf cargo-vet.tar.xz --strip-components=1 -C "$HOME/.cargo/bin" "${asset}/cargo-vet"
          cargo vet --version

      - name: cargo vet
        run: cargo vet --locked

      - name: what to do when this fails
        if: failure()
        run: |
          echo "::notice::A dependency version has no audit. See supply-chain/README.md: review the delta with 'cargo vet diff', then record it with 'cargo vet certify' and commit supply-chain/."
