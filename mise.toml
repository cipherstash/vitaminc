[tools]
rust = "stable"
# Coverage → CRAP (Change Risk Anti-Patterns) tooling. `cargo llvm-cov` produces
# the LCOV file that `cargo crap` scores; see the `crap` task below. Both ship
# prebuilt binaries, so `mise install` binstalls them quickly.
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-crap" = "latest"
# Mutation testing. `cargo mutants` rewrites small pieces of logic and reruns the
# tests; a surviving mutant is a line the suite doesn't pin down. Config lives in
# .cargo/mutants.toml; see the `mutants` task below. Ships a prebuilt binary.
"cargo:cargo-mutants" = "latest"

[tasks.clippy]
description = "Clippy lints (including tests and all features)"
run = "cargo clippy --no-deps --tests --all-features -- -D warnings"

[tasks.crap]
description = "Gate on the CRAP (Change Risk Anti-Patterns) metric across the workspace — fails on complex, under-tested functions"
run = [
  # llvm-tools-preview is required by cargo-llvm-cov; adding it is idempotent.
  "rustup component add llvm-tools-preview",
  # Default features, matching the primary `cargo test` gate (aws-lc-rs backend).
  # Needs LocalStack running for the vitaminc-kms tests, same as `cargo test`.
  "cargo llvm-cov --workspace --lcov --output-path {{ config_root }}/target/vitaminc-lcov.info",
  # Score against the threshold + exclude/allow rules in .cargo-crap.toml.
  # `--fail-above` mirrors the CI gate, so a green local run means a green CI run.
  "cargo crap --workspace --lcov {{ config_root }}/target/vitaminc-lcov.info --fail-above",
]

[tasks.mutants]
description = "Mutation testing (cargo-mutants) across the workspace — surfaces logic the tests don't actually pin down"
run = [
  # Whole-workspace mutation run, reading features/excludes/timeouts from
  # .cargo/mutants.toml. Like `cargo test` / `mise run crap`, the baseline runs
  # the vitaminc-kms tests, so it needs LocalStack running. CI instead runs this
  # `--in-diff` as a fast per-PR gate (.github/workflows/mutants.yml), mutating
  # only the lines a PR changes.
  "cargo mutants",
]

[tasks."pr:gate:has_rust_changes"]
description = "Report whether this branch has Rust changes for a gate (crap, mutants) — CI runs the gate only when it does"
# Usage: mise run pr:gate:has_rust_changes -- <crap|mutants> [--base origin/main]
# Needs only python3, so CI runs it with tool auto-install off.
run = "python3 {{ config_root }}/.github/scripts/has_rust_changes.py"

[tasks."pr:gate:has_rust_changes:test"]
description = "Test the has-Rust-changes check"
run = "python3 -m unittest discover -s {{ config_root }}/.github/scripts -p 'test_*.py'"

[tasks.docs]
dir = "{{ config_root }}/packages/vitaminc"
description = "Build and generate the docs"
run = "cargo doc --all-features --no-deps"
tools.rust = "nightly"
env.RUSTDOCFLAGS = "--cfg docsrs"
