# Configuration for `cargo crap` — the CRAP (Change Risk Anti-Patterns) metric.
#
# CRAP rewards complex code that is well tested and penalises complex code that
# is not:
#
#     CRAP = CC^2 * (1 - coverage)^3 + CC      (CC = cyclomatic complexity)
#
# A simple or fully covered function scores roughly its complexity; a complex,
# untested one scores into the hundreds. In a crypto library that is exactly the
# logic we most want covered before it ships, so the metric surfaces it for us.
#
# Run it locally via `mise run crap` (generates coverage first, then scores).
# Config discovery walks up from the working directory, so this single root file
# applies anywhere in the workspace — and both `mise run crap` and the CI gate
# (.github/workflows/crap.yml) read their threshold/exclude/allow rules from here.

# CRAP score above which a function is flagged. The CI gate (`cargo crap
# --fail-above`) fails when any function exceeds it. 30 is the long-standing
# Crap4J default: a CC-10 function needs ~42% coverage, a CC-15 function ~59%,
# to fall below it. The whole workspace currently tops out around 20, so this
# leaves headroom while still catching a complex, under-tested function added
# in a PR. Lower it over time to ratchet the bar up.
threshold = 30

# Functions with complexity but no coverage data are scored as 0% covered
# (worst case) rather than silently skipped — uninstrumented code is risk too.
missing = "pessimistic"

# Files skipped at walk time, relative to each workspace member's root.
# Defensive: integration tests aren't walked today, but this keeps them out of
# the score if that changes. `test_support.rs` holds `#[cfg(test)]` assertion
# helpers — test code, not shipped risk, so it does not belong in the report.
exclude = ["tests/**", "src/test_support.rs"]

# Functions to analyse but hide from the report. An entry containing `/` or
# `**` matches the defining file; otherwise it matches the function name.
#
# Both groups below are code cargo-llvm-cov cannot observe, so they always read
# as 0% covered and would be permanent false-positives — not code we have
# chosen to leave untested.
#
#   * `random-derives` and `protected-derive`: their expansion logic lives in
#     the `#[proc_macro_derive]` entry points themselves, which run at compile
#     time rather than in the instrumented test binary, so llvm-cov always
#     reads them as 0%.
#
#     NOTE: this is a deferral, not a dismissal — and not a property of
#     proc-macro crates in general. `aead-derive` shows the way out: keep the
#     entry point a trivial shim and put the expansion in an ordinary
#     `fn(DeriveInput) -> Result<TokenStream>`, which unit tests call directly
#     and llvm-cov scores like any other function. Splitting these two the same
#     way would let them come off this list.
#
#   * The `vitaminc-aead-napi` conversion functions and their JS-boundary
#     helpers (`own_enumerable_keys`, `get_property_unknown`,
#     `ensure_plain_object`): each takes a live `napi_env`/`Unknown`/`Object`,
#     which only exists inside a running V8 isolate. `cargo test` has no Node
#     host (the `napi/noop` dev-dependency stubs the symbols so the crate
#     *links*, it does not make the calls work), so these cannot be reached
#     from a Rust unit test at any coverage level. They are named individually
#     rather than by file so the rest of those modules — `forbidden_key`,
#     `eager_capacity` and friends — stays scored.
#
#     NOTE: this is a deferral, not a dismissal. The conversion layer still
#     needs JS-level tests driving a built addon; see the tracking note in
#     packages/aead-napi/README.md.
allow = [
    "**/random-derives/**",
    "**/protected-derive/**",
    "js_to_value",
    "value_to_js",
    "node_to_js",
    "node_from_js",
    "own_enumerable_keys",
    "define_own_property",
    "get_property_unknown",
    "ensure_plain_object",
]
