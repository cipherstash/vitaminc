[package]
name = "vitaminc-plaintext-spike"
description = "Spike: a serde-style plaintext data model that host types implement once, with encryption, transport and equality terms as sinks."
version = "0.0.0"
edition = "2021"
publish = false

# Standalone on purpose: the spike must not touch the vitaminc workspace.
[workspace]

[features]
default = []
# Compile-only sketch of the Node side. `cargo check --features napi`.
napi = ["dep:napi"]

[dependencies]
vitaminc-aead = { path = "../../packages/aead" }
vitaminc-aead-value = { path = "../../packages/aead-value", features = ["chrono", "rust_decimal", "canonical"] }
vitaminc-encrypt = { path = "../../packages/encrypt" }
vitaminc-protected = { path = "../../packages/protected" }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
rust_decimal = { version = "1.41", default-features = false, features = ["std"] }
napi = { version = "3", default-features = false, features = ["napi6"], optional = true }

[dev-dependencies]
serde_json = "1"
